<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · AI Career Advisor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
    </div>
    <div class="particle-field" id="particleField"></div>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">
              <i class="fas fa-{% if category == 'success' %}check-circle{% elif category == 'error' %}exclamation-circle{% else %}info-circle{% endif %}"></i>
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Login Card -->
    <div class="glass-container">
        <div class="logo">
            <i class="fas fa-robot"></i>
            <h1>AI Career</h1>
        </div>
        <p class="welcome-text">Sign in to your intelligent advisor</p>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="Email address" autocomplete="email" required autofocus>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" id="passwordInput" placeholder="Password" autocomplete="current-password" required>
                <button type="button" class="toggle-pw" onclick="togglePassword()" aria-label="Show password">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </button>
            </div>

            <div class="remember-row">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember">
                    <span>Remember me</span>
                </label>
            </div>

            <button type="submit" class="btn-primary" id="loginBtn">
                <i class="fas fa-arrow-right-to-bracket"></i> Sign In
            </button>
        </form>

        <div class="footer-links">
            <a href="{{ url_for('register') }}"><i class="fas fa-user-plus"></i> Register</a>
            <a href="#"><i class="fas fa-key"></i> Forgot?</a>
        </div>

        <div class="tech-stack">
            <span class="tech-badge"><i class="fab fa-python"></i> Flask</span>
            <span class="tech-badge"><i class="fas fa-database"></i> SQLite</span>
            <span class="tech-badge"><i class="fab fa-html5"></i> HTML5</span>
            <span class="tech-badge"><i class="fab fa-css3-alt"></i> CSS3</span>
            <span class="tech-badge"><i class="fab fa-js"></i> JavaScript</span>
            <span class="tech-badge"><i class="fas fa-brain"></i> AI Match</span>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.querySelector('form').addEventListener('submit', function () {
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
            btn.style.opacity = '0.85';
            btn.disabled = true;
        });
    </script>

    <style>
        .toggle-pw {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #7f8db0;
            cursor: pointer;
            font-size: 1rem;
            padding: 6px;
            transition: color 0.2s;
            z-index: 3;
        }
        .toggle-pw:hover { color: #8aa4ff; }
        .toggle-pw:focus { outline: none; }
    </style>
</body>
</html>
